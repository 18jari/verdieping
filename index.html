<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>Mijn boodschappenlijst</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25332c;
      --muted: #788078;
      --green: #356b4b;
      --green-dark: #28543a;
      --paper: #fffefa;
      --line: #e9e9df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      background: #f6f5ef;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { width: min(100%, 580px); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.055em; line-height: 1.05; }
    .intro { margin: 12px 0 26px; color: var(--muted); font-size: 1rem; }
    .card {
      overflow: hidden;
      border: 1px solid #e8e8de;
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 12px 40px #26352c0b;
    }
    .categories { display: grid; grid-template-columns: 1fr 1fr; }
    .category { padding: 18px; }
    .category + .category { border-left: 1px solid var(--line); }
    .category h2 { margin: 0 0 12px; font-size: 1rem; }
    .category-list { display: grid; gap: 10px; }
    .category-item { display: flex; align-items: center; gap: 9px; min-height: 26px; color: #465148; cursor: pointer; }
    .category-item input { width: 18px; height: 18px; margin: 0; accent-color: var(--green); cursor: pointer; }
    .category-item.checked span { color: #969c94; text-decoration: line-through; }
    .section-divider { margin: 0; padding: 12px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    form { display: flex; gap: 10px; padding: 18px; border-bottom: 1px solid var(--line); }
    input[type="text"] {
      min-width: 0; flex: 1; padding: 13px 14px;
      border: 1px solid #dedfd5; border-radius: 11px;
      outline: none; background: #fff; color: var(--ink);
    }
    input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 3px #356b4b1a; }
    ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; list-style: none; margin: 0; padding: 4px 18px; }
    .item { display: flex; align-items: center; gap: 12px; min-height: 36px; border-bottom: 1px solid #f0f0e9; }
    .item:last-child { border-bottom: 0; }
    .check {
      width: 20px; height: 20px; flex: 0 0 20px; margin: 0;
      accent-color: var(--green); cursor: pointer;
    }
    .name { flex: 1; overflow-wrap: anywhere; }
    .remove {
      display: grid; width: 34px; height: 34px; place-items: center;
      border: 0; border-radius: 9px; background: transparent; color: #929990;
      font-size: 1.25rem; cursor: pointer;
    }
    .remove:hover { background: #f5eeee; color: #a3443d; }
    .empty { padding: 34px 20px 38px; color: var(--muted); text-align: center; }
    .empty-icon { display: block; margin-bottom: 8px; font-size: 1.8rem; }
    .footer { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
    @media (max-width: 420px) {
      body { padding: 32px 14px; }
      form { padding: 14px; }
      ul { padding-inline: 14px; }
      .footer { padding-inline: 14px; }
      .category { padding: 15px 12px; }
      .category h2 { font-size: .95rem; }
      .section-divider { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Voor straks in de winkel</p>
    <h1>Mijn boodschappen</h1>
    <p class="intro">Schrijf op wat je nodig hebt. Vink af terwijl je winkelt.</p>

    <section class="card" aria-label="Boodschappenlijst">
      <div class="categories">
        <section class="category" aria-labelledby="fruit-heading">
          <h2 id="fruit-heading">🍎 Fruit</h2>
          <div id="fruit-list" class="category-list"></div>
        </section>
        <section class="category" aria-labelledby="veg-heading">
          <h2 id="veg-heading">🥕 Groenten</h2>
          <div id="veg-list" class="category-list"></div>
        </section>
      </div>
      <h2 class="section-divider">Extra</h2>
      <form id="item-form">
        <input id="item-input" type="text" placeholder="Typ een boodschap en druk op Enter" aria-label="Typ een boodschap en druk op Enter" maxlength="120" autocomplete="off" required>
      </form>
      <h2 class="section-divider">Mijn boodschappenlijst</h2>
      <ul id="item-list" aria-live="polite"></ul>
      <div id="empty" class="empty" hidden>
        <span class="empty-icon" aria-hidden="true">🧺</span>
        Je lijst is nog leeg. Voeg iets toe!
      </div>
      <footer class="footer">
        <span id="count">0 boodschappen</span>
      </footer>
    </section>
  </main>
  <script>
    const STORAGE_KEY = "mijn-boodschappenlijst-v1";
    const form = document.querySelector("#item-form");
    const input = document.querySelector("#item-input");
    const list = document.querySelector("#item-list");
    const empty = document.querySelector("#empty");
    const count = document.querySelector("#count");
    const categoryChoices = {
      fruit: ["Appels", "Bananen", "Peren", "Aardbeien", "Druiven"],
      vegetables: ["Wortelen", "Tomaten", "Komkommer", "Broccoli", "Paprika"]
    };
    let checkedChoices = loadChoices();

    function loadChoices() {
      try {
        const saved = JSON.parse(localStorage.getItem(`${STORAGE_KEY}-categories`) || "{}");
        return saved && typeof saved === "object" ? saved : {};
      } catch {
        return {};
      }
    }

    function renderChoices() {
      for (const [category, choices] of Object.entries(categoryChoices)) {
        const target = document.querySelector(category === "fruit" ? "#fruit-list" : "#veg-list");
        target.replaceChildren();
        choices.forEach(choice => {
          const label = document.createElement("label");
          label.className = `category-item${checkedChoices[choice] ? " checked" : ""}`;
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = Boolean(checkedChoices[choice]);
          checkbox.addEventListener("change", () => {
            checkedChoices[choice] = checkbox.checked;
            label.classList.toggle("checked", checkbox.checked);
            if (checkbox.checked && !items.some(item => item.categoryChoice === choice)) {
              items.push({ name: choice, done: false, categoryChoice: choice });
            } else if (!checkbox.checked) {
              items = items.filter(item => item.categoryChoice !== choice);
            }
            saveItems();
            render();
            try { localStorage.setItem(`${STORAGE_KEY}-categories`, JSON.stringify(checkedChoices)); } catch { /* Keep working for this session. */ }
          });
          const text = document.createElement("span");
          text.textContent = choice;
          label.append(checkbox, text);
          target.append(label);
        });
      }
    }

    function loadItems() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(item => item && typeof item.name === "string" && typeof item.done === "boolean") : [];
      } catch {
        return [];
      }
    }

    let items = loadItems();

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {
        // The list remains usable for this session if browser storage is unavailable.
      }
    }

    function render() {
      for (const choice of Object.values(categoryChoices).flat()) {
        checkedChoices[choice] = items.some(item => item.categoryChoice === choice);
        try { localStorage.setItem(`${STORAGE_KEY}-categories`, JSON.stringify(checkedChoices)); } catch { /* Keep working for this session. */ }
        const choiceLabel = [...document.querySelectorAll(".category-item")].find(label => label.lastElementChild?.textContent === choice);
        if (choiceLabel) {
          choiceLabel.querySelector("input").checked = checkedChoices[choice];
          choiceLabel.classList.toggle("checked", checkedChoices[choice]);
        }
      }
      list.replaceChildren();
      items.forEach(item => {
        const row = document.createElement("li");
        row.className = "item";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;

        const star = document.createElement("span");
        star.setAttribute("aria-hidden", "true");
        star.textContent = "★";
        star.style.color = "#000";
        star.style.marginRight = "8px";

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Verwijder ${item.name}`);
        remove.addEventListener("click", () => {
          items = items.filter(candidate => candidate !== item);
          saveItems();
          render();
        });

        row.append(star, name, remove);
        list.append(row);
      });

      count.textContent = `${items.length} ${items.length === 1 ? "boodschap" : "boodschappen"}`;
      empty.hidden = items.length !== 0;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      items.push({ name, done: false });
      saveItems();
      render();
      input.value = "";
      input.focus();
    });

    renderChoices();
    render();
  </script>
</body>
</html>
